<svg width="1200" height="90" viewBox="0 0 1200 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="50%" stop-color="#1E3A8A">
        <animate attributeName="stop-color" values="#1E3A8A;#3457D5;#1E3A8A" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="90" fill="url(#footGrad)"/>
  <g stroke="#5B7FFF" stroke-width="1.2" opacity="0.4" fill="none">
    <path d="M0,45 H1200" stroke-dasharray="10 8">
      <animate attributeName="stroke-dashoffset" values="0;-180" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
  <circle r="3.5" fill="#8FB2FF">
    <animateMotion dur="6s" repeatCount="indefinite" path="M0,45 H1200"/>
  </circle>
  <text x="600" y="52" text-anchor="middle" font-family="Verdana, sans-serif" font-size="14" fill="#D6E0FF">
    Built as a reusable workflow engine — OPERIVA OS
  </text>
</svg>
