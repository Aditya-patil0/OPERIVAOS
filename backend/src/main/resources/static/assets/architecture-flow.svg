<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="Architecture flow diagram">
  <rect width="1200" height="500" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">System Architecture Flow</text>

  <rect x="80" y="180" width="170" height="80" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="165" y="228" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#1e3a8a">Client</text>

  <rect x="360" y="180" width="170" height="80" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="445" y="228" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#166534">API</text>

  <rect x="640" y="180" width="170" height="80" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="725" y="228" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#92400e">Service</text>

  <rect x="920" y="180" width="170" height="80" rx="14" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="1005" y="228" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#9d174d">Database</text>

  <path d="M250 220 H360" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M530 220 H640" stroke="#16a34a" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M810 220 H920" stroke="#d97706" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L0,12 L12,6 z" fill="#334155"/>
    </marker>
  </defs>
</svg>
